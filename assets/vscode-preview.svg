<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="388" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>
  <!-- Top Tab Bar -->
  <rect x="1" y="1" width="1078" height="36" rx="10" fill="#252526" stroke="#333333"/>
  <circle cx="22" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="19" r="5.5" fill="#27c93f"/>
  <text x="90" y="24" class="sans" font-size="12.5" font-weight="600" fill="#d4d4d4">demo.hue.md</text>
  <line x1="540" y1="1" x2="540" y2="389" stroke="#333333" stroke-width="1.5"/>
  <text x="562" y="24" class="sans" font-size="12.5" font-weight="600" fill="#d4d4d4">Preview demo.hue.md (Ctrl+Shift+V)</text>

  <!-- Left Editor Pane -->
  <g class="mono" font-size="12.5">
    <text x="20" y="68" fill="#858585">1</text>
    <text x="46" y="68" fill="#58a6ff" font-weight="700"># Hue Markdown</text>

    <text x="20" y="94" fill="#858585">2</text>
    <text x="20" y="118" fill="#858585">3</text>
    <rect x="92" y="103" width="100" height="20" rx="3" fill="#0f2e1c"/>
    <rect x="285" y="103" width="84" height="20" rx="3" fill="#3b2410"/>
    <rect x="442" y="103" width="85" height="20" rx="3" fill="#3d1614"/>
    <text x="46" y="118" fill="#d4d4d4">Build: <tspan fill="#3fb950">{ok: passing}</tspan> · Coverage: <tspan fill="#ffa657">{warn: 71%}</tspan> · Deploy: <tspan fill="#ff7b72">{!: blocked}</tspan></text>

    <text x="20" y="146" fill="#858585">4</text>
    <text x="20" y="170" fill="#858585">5</text>
    <text x="46" y="170" fill="#58a6ff" font-weight="700">+-- info Effortless Boxes</text>
    <text x="20" y="194" fill="#858585">6</text>
    <text x="46" y="194" fill="#d4d4d4">| Start with `+--` and `info`, `ok`, `note`, `warn`, or `!`</text>
    <text x="20" y="218" fill="#858585">7</text>
    <text x="46" y="218" fill="#d4d4d4">| Press Enter to auto-continue `| ` on the next line</text>
    <text x="20" y="242" fill="#858585">8</text>
    <text x="46" y="242" fill="#858585">+--</text>

    <text x="20" y="270" fill="#858585">9</text>
    <text x="14" y="294" fill="#858585">10</text>
    <text x="46" y="294" fill="#ff7b72" font-weight="700">+-- ! Never Commit Secrets</text>
    <text x="14" y="318" fill="#858585">11</text>
    <rect x="336" y="303" width="122" height="20" rx="3" fill="#3d1614"/>
    <text x="46" y="318" fill="#d4d4d4">| Rotate any leaked key <tspan fill="#ff7b72">{!: immediately}</tspan>.</text>
    <text x="14" y="342" fill="#858585">12</text>
    <text x="46" y="342" fill="#858585">+--</text>
  </g>

  <!-- Right Live Preview Pane -->
  <g class="sans" fill="#d4d4d4">
    <text x="564" y="74" font-size="19" font-weight="700">Hue Markdown</text>
    <line x1="564" y1="84" x2="1052" y2="84" stroke="#333333"/>

    <text x="564" y="114" font-size="14">
      Build: <tspan fill="#3fb950" font-weight="600">passing</tspan> · Coverage: <tspan fill="#ffa657" font-weight="600">71%</tspan> · Deploy: <tspan fill="#ff7b72" font-weight="600">blocked</tspan>
    </text>

    <rect x="564" y="140" width="488" height="86" rx="6" fill="#0f2444"/>
    <rect x="564" y="140" width="4" height="86" rx="2" fill="#58a6ff"/>
    <text x="580" y="164" font-size="14" font-weight="700" fill="#58a6ff">Effortless Boxes</text>
    <text x="580" y="188" font-size="13.5">Start with <tspan class="mono">+--</tspan> and <tspan class="mono">info</tspan>, <tspan class="mono">ok</tspan>, <tspan class="mono">note</tspan>, <tspan class="mono">warn</tspan>, or <tspan class="mono">!</tspan></text>
    <text x="580" y="210" font-size="13.5">Press Enter to auto-continue <tspan class="mono">| </tspan> on the next line</text>

    <rect x="564" y="246" width="488" height="68" rx="6" fill="#3d1614"/>
    <rect x="564" y="246" width="4" height="68" rx="2" fill="#ff7b72"/>
    <text x="580" y="270" font-size="14" font-weight="700" fill="#ff7b72">Never Commit Secrets</text>
    <text x="580" y="294" font-size="13.5">Rotate any leaked key <tspan fill="#ff7b72" font-weight="700">immediately</tspan>.</text>
  </g>
</svg>