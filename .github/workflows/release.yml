name: Release Hue MD Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & run tests
        run: |
          npm ci
          npm test

      - name: Package all hue-md release artifacts
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Create GitHub Release & upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/*

      - name: Publish VS Code extension to Open VSX (Trusted Publisher OIDC)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx --yes ovsx@latest publish dist/release/hue-md.vsix --trusted-publishing --skip-duplicate
